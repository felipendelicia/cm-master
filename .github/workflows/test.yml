name: Verify skill

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  local-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.txt -r requirements-media.txt
      - run: python -m unittest discover -s tests -v
